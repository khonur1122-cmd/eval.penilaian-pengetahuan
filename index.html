            { id: 2, question: "Berikut ini yang termasuk dimensi pengetahuan adalah ...", options: ["Afektif, sosial, dan emosional", "Faktual, konseptual, prosedural, dan metakognitif", "Sikap, keterampilan, dan kepribadian", "Moral, sosial, dan budaya"], answer: 1, explanation: "Dimensi pengetahuan menurut Taksonomi Bloom yang direvisi mencakup 4 kategori: Faktual, Konseptual, Prosedural, dan Metakognitif." },
            { id: 3, question: "Salah satu tujuan penilaian pengetahuan adalah ...", options: ["Menentukan teman belajar siswa", "Mengetahui tingkat pencapaian kompetensi siswa", "Menentukan tempat duduk siswa", "Menentukan kegiatan ekstrakurikuler siswa"], answer: 1, explanation: "Tujuan utama penilaian pengetahuan adalah untuk mengetahui sejauh mana tingkat pencapaian kompetensi kognitif yang telah ditetapkan." },
            { id: 4, question: "Fungsi penilaian yang digunakan untuk mengetahui kesulitan dan kekurangan siswa disebut fungsi ...", options: ["Sumatif", "Formatif", "Diagnostik", "Administratif"], answer: 2, explanation: "Penilaian diagnostik bertujuan mendeteksi kesulitan, kelemahan, atau kelebihan belajar siswa untuk acuan perbaikan." },
            { id: 5, question: "Penilaian yang dilakukan selama proses pembelajaran untuk mengetahui perkembangan pemahaman siswa disebut penilaian ...", options: ["Formatif", "Sumatif", "Diagnostik", "Akhir"], answer: 0, explanation: "Penilaian formatif dilakukan beriringan dengan proses pembelajaran untuk memberikan umpan balik (feedback) secara berkala." },

            { id: 7, question: "Penilaian yang dilakukan secara terencana mulai dari menentukan kompetensi sampai tindak lanjut disebut prinsip ...", options: ["Sistematis", "Adil", "Reliabel", "Transparan"], answer: 0, explanation: "Prinsip sistematis berarti penilaian dilakukan berurutan, terencana, dan bertahap mengikuti langkah-langkah yang terstruktur." },
            { id: 8, question: "Pengetahuan faktual adalah pengetahuan yang berkaitan dengan ...", options: ["Cara mengatur proses belajar", "Informasi, istilah, fakta, dan detail dasar", "Cara melakukan suatu prosedur", "Hubungan antar konsep"], answer: 1, explanation: "Pengetahuan faktual berisi elemen-elemen dasar yang harus diketahui siswa untuk mengenal suatu disiplin ilmu, seperti simbol, istilah, dan fakta khusus." },
            { id: 9, question: "Contoh pengetahuan faktual adalah ...", options: ["Menentukan strategi belajar yang tepat", "Mengetahui bahwa Proklamasi Kemerdekaan Indonesia terjadi pada 17 Agustus 1945", "Menjelaskan hubungan antara produsen dan konsumen", "Menentukan cara menyelesaikan suatu masalah"], answer: 1, explanation: "Tanggal bersejarah adalah fakta spesifik dan elemen informasi dasar, yang tergolong dalam pengetahuan faktual." },
            { id: 10, question: "Pengetahuan tentang istilah seperti fotosintesis, ekosistem, dan habitat termasuk pengetahuan ...", options: ["Konseptual", "Prosedural", "Faktual", "Metakognitif"], answer: 2, explanation: "Istilah (terminologi) merupakan komponen pengetahuan faktual sebelum siswa merangkainya menjadi pemahaman konsep." },

            { id: 13, question: "Pengetahuan prosedural berkaitan dengan pengetahuan tentang ...", options: ["Apa yang diketahui", "Nama dan istilah", "Bagaimana melakukan sesuatu", "Kemampuan mengenali diri"], answer: 2, explanation: "Pengetahuan prosedural adalah pengetahuan mengenai cara/metode/langkah-langkah dalam melakukan sesuatu." },
            { id: 14, question: "Siswa mengetahui langkah-langkah melakukan penjumlahan bersusun. Hal tersebut termasuk pengetahuan ...", options: ["Faktual", "Konseptual", "Prosedural", "Metakognitif"], answer: 2, explanation: "Pengetahuan tentang urutan atau teknik teknis seperti langkah penjumlahan tergolong pengetahuan prosedural." },
            { id: 15, question: "Menggunakan penggaris dengan meletakkan titik awal benda pada angka nol merupakan contoh pengetahuan tentang ...", options: ["Teknik atau metode", "Terminologi", "Teori", "Pengenalan diri"], answer: 0, explanation: "Penggunaan alat pengukur mengikuti standar operasional tertentu yang merupakan teknik atau metode (prosedural)." },

        const Icon = ({ name, className = "w-4 h-4" }) => {
            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg"

                </svg>
            );
        };

        function App() {
            const { useState, useEffect, useRef } = React;

            // Step & User Navigation
            const [currentStep, setCurrentStep] = useState('welcome'); // 'welcome', 'quiz', 'result', 'admin'
            const [studentName, setStudentName] = useState('');
            const [studentNim, setStudentNim] = useState('');
            const [formError, setFormError] = useState('');

            // Quiz State
            const [currentIndex, setCurrentIndex] = useState(0);
            const [selectedAnswers, setSelectedAnswers] = useState({});
            const [showReview, setShowReview] = useState(false);

            // Timer state
            const [elapsedSeconds, setElapsedSeconds] = useState(0);
            const timerRef = useRef(null);

            // Firebase & Scores state
            const [user, setUser] = useState(null);
            const [scores, setScores] = useState([]);
            const [isLoadingScores, setIsLoadingScores] = useState(true);

            // Admin Mode & Security
            const [isAdmin, setIsAdmin] = useState(false);
            const [adminPinInput, setAdminPinInput] = useState('');
            const [pinError, setPinError] = useState('');
            const [showPinModal, setShowPinModal] = useState(false);
            const [showShareModal, setShowShareModal] = useState(false);
            const [copySuccess, setCopySuccess] = useState(false);

            // Admin Dashboard Filter & Search
            const [searchQuery, setSearchQuery] = useState('');
            const [sortBy, setSortBy] = useState('rank'); // 'rank', 'date', 'name', 'score'

            // Custom Modal Alert/Confirm state
            const [modalNotice, setModalNotice] = useState(null);

            // Initialize Firebase Auth & Realtime Sync
            useEffect(() => {
                const initAuth = async () => {
                    const { auth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.firebaseServices;
                    
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Auth initialization error:", err);
                    }

                    onAuthStateChanged(auth, (usr) => {
                        setUser(usr);
                    });
                };

                initAuth();
            }, []);

            // Subscribe to Firestore Scores Collection in Real-Time
            useEffect(() => {
                if (!user) return;

                const { db, appId, collection, onSnapshot } = window.firebaseServices;
                const scoresRef = collection(db, 'artifacts', appId, 'public', 'data', 'quiz_scores');

                const unsubscribe = onSnapshot(scoresRef, (snapshot) => {
                    const loadedScores = [];
                    snapshot.forEach(doc => {
                        loadedScores.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });

                    // Sort logic for Leaderboard: Highest Correct -> Lowest Time
                    loadedScores.sort((a, b) => {
                        if (b.correct !== a.correct) {
                            return b.correct - a.correct;
                        }
                        return a.time - b.time;
                    });

                    setScores(loadedScores);
                    setIsLoadingScores(false);
                }, (error) => {
                    console.error("Firestore onSnapshot Error:", error);
                    setIsLoadingScores(false);
                });

                return () => unsubscribe();
            }, [user]);

            // Timer effect during active quiz
            useEffect(() => {
                if (currentStep === 'quiz') {
                    timerRef.current = setInterval(() => {
                        setElapsedSeconds(prev => prev + 1);
                    }, 1000);
                } else {
                    clearInterval(timerRef.current);
                }
                return () => clearInterval(timerRef.current);
            }, [currentStep]);

            const formatTime = (totalSeconds) => {
                const mins = Math.floor(totalSeconds / 60);
                const secs = totalSeconds % 60;
                return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };

            const handleSelectOption = (optionIndex) => {
                setSelectedAnswers(prev => ({
                    ...prev,
                    [currentIndex]: optionIndex
                }));
            };

            const calculateScore = () => {
                let correctCount = 0;
                questionsData.forEach((q, idx) => {
                    if (selectedAnswers[idx] === q.answer) {
                        correctCount++;
                    }
                });
                return Math.round((correctCount / questionsData.length) * 100);
            };

            const getCorrectCount = () => {
                let count = 0;
                questionsData.forEach((q, idx) => {
                    if (selectedAnswers[idx] === q.answer) {
                        count++;
                    }
                });
                return count;
            };

            const getAnsweredCount = () => Object.keys(selectedAnswers).length;

            const startQuiz = (e) => {
                e.preventDefault();
                if (!studentName.trim() || !studentNim.trim()) {
                    setFormError('Silakan isi Nama dan NIM Anda terlebih dahulu!');
                    return;
                }
                setFormError('');
                setCurrentStep('quiz');
                setCurrentIndex(0);
                setSelectedAnswers({});
                setElapsedSeconds(0);
                setShowReview(false);
            };

            const finishQuiz = async () => {
                clearInterval(timerRef.current);

                const correctCount = getCorrectCount();
                const finalScore = calculateScore();
                const timeTaken = elapsedSeconds;

                const newEntry = {
                    name: studentName.trim(),
                    nim: studentNim.trim(),
                    score: finalScore,
                    correct: correctCount,
                    total: questionsData.length,
                    time: timeTaken,
                    timestamp: Date.now(),
                    dateStr: new Date().toLocaleDateString('id-ID', { 
                        day: 'numeric', 
                        month: 'short', 
                        year: 'numeric',
                        hour: '2-digit', 
                        minute: '2-digit' 
                    })
                };

                // Save submission to Firestore database
                if (user) {
                    try {
                        const { db, appId, collection, addDoc } = window.firebaseServices;
                        const scoresRef = collection(db, 'artifacts', appId, 'public', 'data', 'quiz_scores');
                        await addDoc(scoresRef, newEntry);
                    } catch (err) {
                        console.error("Error saving score to Cloud Firestore:", err);
                    }
                }

                setCurrentStep('result');
            };

            // Unlock Admin Mode with PIN check
            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPinInput === '1234' || adminPinInput.toLowerCase() === 'admin') {
                    setIsAdmin(true);
                    setShowPinModal(false);
                    setAdminPinInput('');
                    setPinError('');
                    setCurrentStep('admin');
                } else {
                    setPinError('PIN Admin Salah! (Gunakan default: 1234)');
                }
            };

            // Copy Share Link to clipboard using iframe fallback
            const copyShareLink = () => {
                const currentUrl = window.location.href;
                const tempInput = document.createElement('input');
                tempInput.value = currentUrl;
                document.body.appendChild(tempInput);
                tempInput.select();
                try {
                    document.execCommand('copy');
                    setCopySuccess(true);

                                                            <span className="text-sm font-bold text-slate-400">Soal #{idx + 1}</span>
                                                            {isCorrect ? (
                                                                <span className="bg-emerald-100 text-emerald-700 text-xs px-2.5 py-1 rounded-full font-semibold flex items-center gap-1">
                                                                    <Icon name="check" className="w-3.5 h-3.5" /> Benar
                                                                </span>
                                                            ) : (
                                                                <span className="bg-rose-100 text-rose-700 text-xs px-2.5 py-1 rounded-full font-semibold flex items-center gap-1">
                                                                    <Icon name="x" className="w-3.5 h-3.5" /> Salah / Tidak Diisi
                                                                </span>
                                                            )}
                                                        </div>
                                                        <h4 className="font-semibold text-slate-800 text-base mb-4">{q.question}</h4>

                                                        <div className="space-y-2 mb-4">
                                                            {q.options.map((opt, optIdx) => {
                                                                const isUserChoice = userAns === optIdx;
                                                                const isRightChoice = q.answer === optIdx;

                                                                let bgStyle = "bg-slate-50 border-slate-100 text-slate-600";
                                                                if (isRightChoice) {
                                                                    bgStyle = "bg-emerald-50 border-emerald-300 text-emerald-900 font-medium";
                                                                } else if (isUserChoice && !isRightChoice) {
                                                                    bgStyle = "bg-rose-50 border-rose-300 text-rose-900 line-through";
                                                                }

                                                                return (
                                                                    <div key={optIdx} className={`p-3 rounded-xl text-sm border flex items-center justify-between ${bgStyle}`}>
                                                                        <span><strong>{optionLabels[optIdx]}.</strong> {opt}</span>
                                                                        {isRightChoice && <span className="text-xs bg-emerald-600 text-white px-2 py-0.5 rounded font-bold">Jawaban Benar</span>}
                                                                        {isUserChoice && !isRightChoice && <span className="text-xs bg-rose-600 text-white px-2 py-0.5 rounded font-bold">Pilihan Anda</span>}
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>

                                                        <div className="bg-slate-50 p-3.5 rounded-xl text-xs text-slate-600 border border-slate-100">
                                                            <strong className="text-slate-700 block mb-1">Penjelasan:</strong>
                                                            {q.explanation}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {}
                        {currentStep === 'admin' && isAdmin && (
                            <div className="space-y-6">
                                {/* Admin Header Banner */}
                                <div className="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white rounded-2xl p-6 sm:p-8 shadow-md">
                                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                        <div>
                                            <div className="inline-flex items-center gap-2 bg-indigo-500/30 text-indigo-200 text-xs font-semibold px-3 py-1 rounded-full border border-indigo-400/20 mb-3">
                                                <Icon name="shield-check" className="w-4 h-4 text-emerald-400" />
                                                <span>Dashboard Dosen / Guru (Admin Mode)</span>
                                            </div>
                                            <h2 className="text-2xl font-bold text-white">Rekap Nilai Penilaian Pengetahuan</h2>
                                            <p className="text-slate-300 text-xs sm:text-sm mt-1">
                                                Pantau hasil pengerjaan kuis seluruh mahasiswa secara real-time dari cloud server.
                                            </p>
                                        </div>

                                        <div className="flex flex-wrap items-center gap-2 shrink-0">
                                            <button
                                                onClick={exportToCSV}
                                                className="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow transition flex items-center gap-2"
                                            >
                                                <Icon name="download" className="w-4 h-4" />
                                                <span>Unduh Excel (CSV)</span>
                                            </button>
                                            <button
                                                onClick={deleteAllScores}
                                                className="px-4 py-2.5 bg-rose-600/80 hover:bg-rose-600 text-white text-xs font-bold rounded-xl shadow transition flex items-center gap-2"
                                            >
                                                <Icon name="trash-2" className="w-4 h-4" />
                                                <span>Reset Rekap Nilai</span>
                                            </button>
                                        </div>
                                    </div>

                                    {/* Quick Class Statistics */}
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mt-6 pt-6 border-t border-slate-700/60">
                                        <div className="bg-slate-800/60 border border-slate-700/80 p-3.5 rounded-xl">
                                            <p className="text-[10px] text-slate-400 uppercase font-bold">Total Mahasiswa</p>
                                            <p className="text-xl font-extrabold text-white mt-0.5">{scores.length} Orang</p>
                                        </div>
                                        <div className="bg-slate-800/60 border border-slate-700/80 p-3.5 rounded-xl">
                                            <p className="text-[10px] text-slate-400 uppercase font-bold">Rata-Rata Nilai</p>
                                            <p className="text-xl font-extrabold text-amber-400 mt-0.5">
                                                {scores.length > 0 
                                                    ? Math.round(scores.reduce((acc, curr) => acc + curr.score, 0) / scores.length) 
                                                    : 0}
                                            </p>
                                        </div>
                                        <div className="bg-slate-800/60 border border-slate-700/80 p-3.5 rounded-xl">
                                            <p className="text-[10px] text-slate-400 uppercase font-bold">Nilai Tertinggi</p>
                                            <p className="text-xl font-extrabold text-emerald-400 mt-0.5">
                                                {scores.length > 0 ? Math.max(...scores.map(s => s.score)) : 0}
                                            </p>
                                        </div>
                                        <div className="bg-slate-800/60 border border-slate-700/80 p-3.5 rounded-xl">
                                            <p className="text-[10px] text-slate-400 uppercase font-bold">Waktu Rata-Rata</p>
                                            <p className="text-xl font-extrabold text-indigo-300 mt-0.5">
                                                {scores.length > 0 
                                                    ? formatTime(Math.round(scores.reduce((acc, curr) => acc + curr.time, 0) / scores.length)) 
                                                    : '00:00'}
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                {/* Filter Controls */}
                                <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3">
                                    <div className="relative w-full sm:w-72">
                                        <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                            <Icon name="search" className="w-4 h-4" />
                                        </span>
                                        <input
                                            type="text"
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            placeholder="Cari Nama atau NIM..."
                                            className="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white"
                                        />
                                    </div>

                                    <div className="flex items-center gap-2 w-full sm:w-auto justify-end">
                                        <label className="text-xs font-semibold text-slate-500 shrink-0">Urutkan:</label>
                                        <select
                                            value={sortBy}
                                            onChange={(e) => setSortBy(e.target.value)}
                                            className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        >
                                            <option value="rank">Peringkat (Jawaban Benar & Kecepatan)</option>
                                            <option value="score">Skor Tertinggi</option>
                                            <option value="date">Waktu Submission Terakhir</option>
                                            <option value="name">Nama Mahasiswa (A-Z)</option>
                                        </select>
                                    </div>
                                </div>

                                {/* Main Data Table */}
                                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                                    {isLoadingScores ? (
                                        <div className="p-8 text-center text-slate-400 text-xs">
                                            Menghubungkan ke Cloud Firestore...
                                        </div>
                                    ) : getFilteredScores().length === 0 ? (
                                        <div className="p-12 text-center text-slate-400 text-sm">
                                            Tidak ada data nilai mahasiswa yang ditemukan.
                                        </div>
                                    ) : (
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse">
                                                <thead>
                                                    <tr className="bg-slate-50 border-b border-slate-200 text-[11px] font-bold uppercase text-slate-400">
                                                        <th className="py-3 px-4">Rank</th>
                                                        <th className="py-3 px-4">Nama Mahasiswa</th>
                                                        <th className="py-3 px-4">NIM</th>
                                                        <th className="py-3 px-4 text-center">Jawaban Benar</th>
                                                        <th className="py-3 px-4 text-center">Skor Akhir</th>
                                                        <th className="py-3 px-4 text-center">Durasi</th>
                                                        <th className="py-3 px-4 text-center">Tanggal & Jam</th>
                                                        <th className="py-3 px-4 text-center">Aksi</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 text-xs">
                                                    {getFilteredScores().map((item, idx) => (
                                                        <tr key={item.id} className="hover:bg-slate-50/80 transition">
                                                            <td className="py-3 px-4">
                                                                <span className={`w-6 h-6 rounded-lg font-extrabold flex items-center justify-center text-[10px] ${
                                                                    idx === 0 ? 'bg-amber-400 text-white shadow-sm' :
                                                                    idx === 1 ? 'bg-slate-300 text-slate-800' :
                                                                    idx === 2 ? 'bg-amber-700 text-white' :
                                                                    'bg-slate-100 text-slate-500'
                                                                }`}>
                                                                    {idx + 1}
                                                                </span>
                                                            </td>
                                                            <td className="py-3 px-4 font-bold text-slate-800">
                                                                {item.name}
                                                            </td>
                                                            <td className="py-3 px-4 text-slate-500 font-mono">
                                                                {item.nim}
                                                            </td>
                                                            <td className="py-3 px-4 text-center font-semibold text-slate-700">
                                                                {item.correct} / {item.total}
                                                            </td>
                                                            <td className="py-3 px-4 text-center">
                                                                <span className={`inline-block px-2.5 py-1 rounded-full font-extrabold ${
                                                                    item.score >= 75 ? 'bg-emerald-100 text-emerald-800' :
                                                                    item.score >= 60 ? 'bg-amber-100 text-amber-800' :
                                                                    'bg-rose-100 text-rose-800'
                                                                }`}>
                                                                    {item.score}
                                                                </span>
                                                            </td>
                                                            <td className="py-3 px-4 text-center font-medium text-slate-500">
                                                                {formatTime(item.time)}
                                                            </td>
                                                            <td className="py-3 px-4 text-center text-slate-400 text-[11px]">
                                                                {item.dateStr || '-'}
                                                            </td>
                                                            <td className="py-3 px-4 text-center">
                                                                <button
                                                                    onClick={() => deleteScoreRecord(item.id, item.name)}
                                                                    className="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition"
                                                                    title="Hapus Baris Ini"
                                                                >
                                                                    <Icon name="trash-2" className="w-4 h-4" />
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400 flex flex-col sm:flex-row items-center justify-between px-6 max-w-5xl mx-auto w-full gap-2">
                        <p>© Penilaian Pengetahuan Interaktif • Portal Dosen & Mahasiswa</p>
                        <div className="flex items-center gap-3">
                            <button onClick={() => setShowShareModal(true)} className="hover:text-indigo-600 transition">Bagikan Link Kuis</button>
                            <span>•</span>
                            <button onClick={() => setShowPinModal(true)} className="hover:text-indigo-600 transition">Akses Admin Guru</button>
                        </div>
                    </footer>

                    {}
                    {/* Admin Pin Login Modal */}
                    {showPinModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-sm w-full border border-slate-200 shadow-xl">
                                <div className="flex items-center justify-between mb-4">
                                    <div className="flex items-center gap-2 text-slate-800 font-bold">
                                        <div className="p-2 bg-amber-100 text-amber-700 rounded-xl">
                                            <Icon name="lock" className="w-5 h-5" />
                                        </div>
                                        <h3>Verifikasi Guru / Admin</h3>
                                    </div>
                                    <button onClick={() => setShowPinModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                <form onSubmit={handleAdminLogin} className="space-y-4">
                                    {pinError && (
                                        <p className="text-xs text-rose-600 font-semibold bg-rose-50 p-2.5 rounded-lg border border-rose-100">{pinError}</p>
                                    )}
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">PIN Keamanan Dosen/Guru</label>
                                        <input
                                            type="password"
                                            value={adminPinInput}
                                            onChange={(e) => setAdminPinInput(e.target.value)}
                                            placeholder="Masukkan PIN (Default: 1234)"
                                            className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            autoFocus
                                        />
                                    </div>

                                    <button
                                        type="submit"
                                        className="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow transition text-xs"
                                    >
                                        Masuk Dashboard Guru
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Share Link Modal */}
                    {showShareModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full border border-slate-200 shadow-xl">
                                <div className="flex items-center justify-between mb-4">
                                    <div className="flex items-center gap-2 text-slate-800 font-bold">
                                        <div className="p-2 bg-indigo-100 text-indigo-700 rounded-xl">
                                            <Icon name="share-2" className="w-5 h-5" />
                                        </div>
                                        <h3>Bagikan Link ke Mahasiswa</h3>
                                    </div>
                                    <button onClick={() => setShowShareModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                <p className="text-xs text-slate-500 mb-4 leading-relaxed">
                                    Salin tautan di bawah ini dan bagikan kepada mahasiswa Anda melalui WhatsApp, Google Classroom, atau LMS. Mahasiswa dapat langsung mengerjakan tanpa perlu membuat akun.
                                </p>

                                <div className="flex items-center gap-2 bg-slate-50 p-2 border border-slate-200 rounded-xl mb-4">
                                    <input
                                        type="text"
                                        readOnly
                                        value={window.location.href}
                                        className="bg-transparent text-xs text-slate-700 font-mono w-full focus:outline-none px-2"
                                    />
                                    <button
                                        onClick={copyShareLink}
                                        className="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-lg shrink-0 flex items-center gap-1.5 transition"
                                    >
                                        <Icon name="copy" className="w-3.5 h-3.5" />
                                        <span>{copySuccess ? 'Tersalin!' : 'Salin Link'}</span>
                                    </button>
                                </div>

                                {copySuccess && (
                                    <p className="text-xs text-emerald-600 font-semibold text-center mb-2">
                                        ✓ Link berhasil disalin ke clipboard!
                                    </p>
                                )}

                                <div className="bg-amber-50 p-3 rounded-xl border border-amber-200 text-[11px] text-amber-800">
                                    <strong>Petunjuk Guru:</strong> Nilai yang disubmit mahasiswa dari link mana pun akan otomatis masuk secara real-time ke Dashboard Guru Anda.
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Custom Confirmation Modal */}
                    {modalNotice && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-sm w-full border border-slate-200 shadow-xl text-center">
                                <div className="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-3">
                                    <Icon name="alert-circle" className="w-6 h-6" />
                                </div>
                                <h3 className="font-bold text-slate-800 text-base mb-1">{modalNotice.title}</h3>
                                <p className="text-xs text-slate-500 mb-6">{modalNotice.message}</p>

                                <div className="flex items-center gap-2 justify-center">
                                    <button
                                        onClick={() => setModalNotice(null)}
                                        className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition"
                                    >
                                        Batal
                                    </button>
                                    {modalNotice.onConfirm && (
                                        <button
                                            onClick={modalNotice.onConfirm}
                                            className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl transition"
                                        >
                                            {modalNotice.confirmText || 'Ya, Lanjutkan'}
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
